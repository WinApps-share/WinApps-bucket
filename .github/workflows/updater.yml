name: Run Updater Script

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 */3 * *'  # 每3天的00:00执行一次
  workflow_dispatch:

jobs:
  run-updater:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path updater\requirements.txt) { pip install -r updater\requirements.txt }

      - name: Set up Git for commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase false
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Run updater script
        id: updater
        continue-on-error: true
        run: python updater\main.py --report "${{ runner.temp }}\updater-summary.json"

      - name: Write update summary
        if: always()
        shell: pwsh
        run: |
          $reportPath = "${{ runner.temp }}\updater-summary.json"
          if (-not (Test-Path $reportPath)) {
            @(
              '## 自动更新汇总'
              ''
              '> 更新程序未能生成统计报告，请查看运行日志。'
            ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
            exit 0
          }

          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          @(
            '## 自动更新汇总'
            ''
            '| 指标 | 数量 |'
            '| --- | ---: |'
            "| 检查 | $($report.checked) |"
            "| 成功 | $($report.succeeded) |"
            "| 实际更新 | $($report.updated) |"
            "| 无需更新 | $($report.unchanged) |"
            "| 失败 | $($report.failed) |"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

          $failedNames = @(
            $report.results |
              Where-Object { $_.status -eq 'failed' } |
              ForEach-Object { $_.name }
          )
          if ($failedNames.Count -gt 0) {
            @(
              ''
              "### 失败项目 ($($failedNames.Count))"
              ''
              ($failedNames | ForEach-Object { "- ``$_``" })
            ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }
